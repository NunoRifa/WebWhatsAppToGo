name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Prepare Keystore from Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/whatsgo-release.jks
            echo "$KEY_PROPERTIES" > android/key.properties
          else
            echo "Building with debug signing fallback..."
          fi

      - name: Run Flutter Static Analysis
        run: flutter analyze

      - name: Build Universal Release APK
        run: flutter build apk --release -t lib/main.dart --android-skip-build-dependency-validation

      - name: Build Split per-ABI Release APKs
        run: flutter build apk --release -t lib/main.dart --split-per-abi --android-skip-build-dependency-validation

      - name: Package & Generate SHA-256 Checksums
        run: |
          mkdir -p dist/release
          cp build/app/outputs/flutter-apk/app-release.apk dist/release/whatsgo-${{ github.ref_name }}-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/release/whatsgo-${{ github.ref_name }}-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/release/whatsgo-${{ github.ref_name }}-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/release/whatsgo-${{ github.ref_name }}-x86_64.apk
          cd dist/release
          sha256sum *.apk > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*.apk
            dist/release/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false

