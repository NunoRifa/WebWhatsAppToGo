AutoName: WhatsGo
Summary: Modern WhatsApp Web Client for Android with Responsive 1-Column Layout

Description: |
  WhatsGo (WA Web To Go Reborn) is a modern Android client based on Flutter
  and Android System InAppWebView for running WhatsApp Web seamlessly on smartphones.

  Features:
  * Responsive 1-column mobile layout with smart back-navigation
  * Dynamic User-Agent editor preventing browser deprecation messages
  * Native Android Foreground Service for real-time incoming message notifications
  * Direct Chat without saving phone contacts
  * Media upload & Blob download manager to local storage
  * Biometric app lock (fingerprint/face) with device PIN/pattern fallback
  * Battery optimization exemption support for background reliability

RepoType: git
Repo: https://github.com/nunorifa/WhatsGo.git

